<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 56" fill="none">
  <g stroke="#B88C1A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- NW-SE diagonal line -->
    <line x1="11" y1="11" x2="45" y2="45"/>
    <!-- NW arrowhead (V pointing NW) -->
    <polyline points="19,11 11,11 11,19"/>
    <!-- SE arrowhead (V pointing SE) -->
    <polyline points="37,45 45,45 45,37"/>
    <!-- NE-SW diagonal line -->
    <line x1="45" y1="11" x2="11" y2="45"/>
    <!-- NE arrowhead (V pointing NE) -->
    <polyline points="37,11 45,11 45,19"/>
    <!-- SW arrowhead (V pointing SW) -->
    <polyline points="11,37 11,45 19,45"/>
  </g>
</svg>
